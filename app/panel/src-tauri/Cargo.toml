[package]
name = "fix-edge-panel"
version = "0.1.0"
description = "Edge+ - desktop panel for Edge's live feature switches"
authors = ["Avi"]
edition = "2021"
license = "Apache-2.0"

# The panel is the workspace root. `edge-native` is a separate member crate that
# holds every Win32 FFI call (process enumeration, DLL injection, the external-
# extension registry, CRX parsing, the dev-mode snooze) so this crate can keep
# `unsafe_code = "forbid"`. The dev-mode waiter is a tiny second binary in this
# same crate, re-run headless (see src/bin/devmode_waiter.rs).
[workspace]
members = ["edge-native"]
resolver = "2"

[lib]
name = "fix_edge_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
edge-native = { path = "edge-native" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Strict lints - the Rust equivalent of the frontend's oxlint/eslint layers.
# `cargo clippy -- -D warnings` (the lint:rust script) turns these into errors.
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Tauri #[command] fns take owned args + State by value (the framework
# deserializes into them), so pass-by-value is required.
needless_pass_by_value = "allow"
unwrap_used = "deny"
expect_used = "allow"
