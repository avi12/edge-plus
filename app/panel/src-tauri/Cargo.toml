[package]
name = "edgeplus"
# The product's one version: the window's footer, the update check and the
# release all read it from here.
version = "0.3.4"
description = "Live feature switches for Microsoft Edge"
authors = ["Avi"]
edition = "2024"
license = "Apache-2.0"

# The core is the workspace root. `edge-native` is a member crate that holds
# every Win32 and WinRT call, so this crate keeps `unsafe_code = "forbid"`.
[workspace]
members = ["edge-native", "launcher"]
resolver = "3"

[[bin]]
name = "edgeplus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
edge-native = { path = "edge-native" }
winui-svelte-launcher = { git = "https://github.com/avi12/winui-svelte", rev = "9bcd1ca2be103751397dded1d92e41c6a9850eed" }

[dev-dependencies]
ts-rs = { version = "11", features = ["no-serde-warnings"] }

[profile.release]
# The panel idles at 0% CPU, so the build's speed matters more than the code's:
# one codegen unit with fat LTO took two minutes to rebuild after a one-line edit.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# `cargo clippy -- -D warnings` (pnpm lint:rust) turns these into errors.

# avi12-lint:begin rust-config (generated from rust-config-avi12; edit avi12-rust.local.toml)
[workspace.lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# no-unchecked-cast
as_conversions = "deny"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[lints.rust]
# warnings-are-errors, no-suppression, naming-case, no-unused, no-dead-code
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unused_mut = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
# narrowest-visibility
unreachable_pub = "deny"
# public-api-docs
missing_docs = "deny"
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation of Result and panics is public-API prose; missing_docs covers the rest
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# A pedantic hint that every pure function carry #[must_use]; rustc unused_must_use covers real results
must_use_candidate = "allow"
# no-unchecked-unwrap
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# Const items and repr enums convert integer widths and discriminants where From and TryFrom are not usable (const context, `self as u64`)
as_conversions = "allow"
cast_possible_truncation = "deny"
undocumented_unsafe_blocks = "deny"
# no-suppression
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# todo-needs-owner
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# identifier-length (the idioms are in clippy.toml)
min_ident_chars = "deny"
# early-return
needless_return = "deny"
redundant_else = "deny"
collapsible_else_if = "deny"
# size-limits, max-nesting (thresholds in clippy.toml)
cognitive_complexity = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# no-floating-result
let_underscore_future = "deny"
# banned-apis (the list is in clippy.toml)
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Flag structs mirror independent switches of the wire format and the settings file
struct_excessive_bools = "allow"
# avi12-lint:end
