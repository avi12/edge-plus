[package]
name = "edgeplus"
# The product's one version: the window's footer, the update check and the
# release all read it from here.
version = "0.1.0"
description = "Live feature switches for Microsoft Edge"
authors = ["Avi"]
edition = "2024"
license = "Apache-2.0"

# The core is the workspace root. `edge-native` is a member crate that holds
# every Win32 and WinRT call, so this crate keeps `unsafe_code = "forbid"`.
[workspace]
members = ["edge-native"]
resolver = "3"

[[bin]]
name = "edgeplus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
edge-native = { path = "edge-native" }

[dev-dependencies]
ts-rs = { version = "11", features = ["no-serde-warnings"] }

[profile.release]
# The panel idles at 0% CPU, so the build's speed matters more than the code's:
# one codegen unit with fat LTO took two minutes to rebuild after a one-line edit.
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# `cargo clippy -- -D warnings` (pnpm lint:rust) turns these into errors.
[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
# The single-letter and two-letter names the house rules forbid; the idioms
# they allow (i, j, x, y, hr, ...) are listed in clippy.toml.
min_ident_chars = "warn"
